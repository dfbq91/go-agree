<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 92" width="352" height="92" fill="none">
  <!-- go-agree Official Logo: Calibrated SaaS Optical Proportions -->
  <defs>
    <linearGradient id="cobaltGradient" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="iceBaseGradient" x1="18" y1="0" x2="72" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <g transform="translate(2, 2)">
    <!-- Main Icon Badge Container: Rich Cobalt Gradient with soft radius -->
    <rect width="88" height="88" rx="24" fill="url(#cobaltGradient)"/>
    
    <!-- Signature Curve with integrated execution check flourish at terminal -->
    <path d="M 18 56 C 24 26 34 22 36 35 C 38 48 27 60 38 54 C 48 48 50 35 56 42 L 62 50 L 73 31" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base Rule with smooth gradient transitioning into consensus emerald -->
    <path d="M 18 70 L 72 70" fill="none" stroke="url(#iceBaseGradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Consensus Integrity Pin -->
    <circle cx="73" cy="31" r="2.5" fill="#A7F3D0"/>
  </g>

  <!-- Typography: Calibrated for optical hierarchy and high legibility -->
  <g transform="translate(108, 54)">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.035em" fill="#141B2B">go<tspan fill="#2563EB">agree</tspan></text>
    
    <!-- Micro Tagline / Category Definition -->
    <text x="2" y="25" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.11em" fill="#555F6D">SMART AGREEMENT INTELLIGENCE</text>
  </g>
</svg>
